[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nlp-text-classification"
version = "0.1.0"
description = "Reproducible English emotion and Chinese movie-review classification experiments."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "scikit-learn>=1.4,<2", "joblib>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]
api = ["fastapi>=0.110", "uvicorn>=0.30"]
deeplearning = ["torch>=2.3", "transformers>=4.48", "accelerate>=1.0", "safetensors>=0.4", "PyYAML>=6"]
embedding = ["gensim>=4.3"]
report = ["matplotlib>=3.8", "pandas>=2.2"]

[project.scripts]
nlp-text-classification = "nlp_text_classification.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

target-version = "py310"
